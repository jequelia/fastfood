services:
  mysql:
    image: mysql:8.0
    container_name: fastfood-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fastfood
      MYSQL_TEST_DATABASE: fastfood_test
      MYSQL_USER: user-admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - local-network
    healthcheck:
      test: /usr/bin/mysql -uroot -prootpassword -e "SHOW DATABASES"

  adminer:
    image: adminer
    container_name: fastfood-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - local-network

  newrelic-agent:
    image: newrelic/infrastructure:latest
    cap_add:
      - SYS_PTRACE
    environment:
      - NRIA_LICENSE_KEY=33352751491fa0defac08a899f117bb0FFFFNRAL
    networks:
      - local-network

